[workspace]
resolver = "3"
# challenge/, intel/ and edge-core/ are pre-registered Phase 1 crates (docs/impl/phase1-spec.md §2).
members = ["core", "challenge", "intel", "edge-core", "edge", "proto/rust"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
license = "Apache-2.0"
repository = "https://github.com/SkyBlue997/MorphGate"

[workspace.dependencies]
# Internal crates
mg-core = { path = "core" }
mg-proto = { path = "proto/rust" }
mg-challenge = { path = "challenge" }
mg-intel = { path = "intel" }
mg-edge-core = { path = "edge-core" }

# Serialization / data contract
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
prost = "0.14.1"
prost-build = "0.14.1"
protox = "0.9.0"
toml = "1"

# Edge runtime. Pingora is 0.x and every minor release breaks the API, so it is
# pinned exactly; all Pingora-specific code lives in the `mg-edge` crate.
# `connection_filter`: drop TCP peers outside Cloudflare's ranges before the TLS
# handshake on origin_mtls listeners (spec §9.2, WP-E1a).
pingora = { version = "=0.9.0", default-features = false, features = ["proxy", "boringssl", "connection_filter"] }
pingora-prometheus = "=0.9.0"
bytes = "1.10"
async-trait = "0.1.89"
clap = { version = "4.5", features = ["derive"] }
log = "0.4.28"
env_logger = { version = "0.11.8", default-features = false, features = ["auto-color", "humantime"] }
thiserror = "2.0.17"

# mg-challenge (Phase 1, WP-R2): sealed challenge, epoch keys, PoW, clearance tokens.
# pasetors' "v4" feature brings ed25519-compact, which is also the workspace's
# single Ed25519 implementation (bundle signature verification in mg-edge).
pasetors = { version = "0.8.1", default-features = false, features = ["std", "v4"] }
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc", "zeroize"] }
hkdf = "0.13.0"
sha2 = "0.11.0"
hmac = "0.13.0"
subtle = "2.6.1"
zeroize = { version = "1.8.2", features = ["derive"] }
base64 = "0.23.1"

# mg-intel (Phase 1, WP-R3): IP sets, GeoLite2 mmdb, crawler registry.
maxminddb = "0.32.0"

# mg-edge-core (Phase 1, WP-C1..C4) and mg-edge: async runtime pieces that run
# inside Pingora background services. reqwest never reads proxy environment
# variables (the code calls ClientBuilder::no_proxy, spec §9.10); its rustls
# stack (aws-lc-rs) is TLS-only, bundle signatures use ed25519-compact.
tokio = { version = "1.53", default-features = false, features = ["rt", "time", "sync", "macros", "net", "io-util"] }
redis = { version = "1.7.1", default-features = false, features = ["tokio-comp", "connection-manager", "script"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
ed25519-compact = { version = "2.6.0", default-features = false }
getrandom = "0.4.3"
prometheus = { version = "0.14.0", default-features = false }
arc-swap = "1.9"
hickory-resolver = "0.26.3"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
