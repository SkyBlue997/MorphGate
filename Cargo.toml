[workspace]
resolver = "3"
members = ["core", "edge", "proto/rust"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[workspace.dependencies]
# Internal crates
mg-core = { path = "core" }
mg-proto = { path = "proto/rust" }

# Serialization / data contract
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
prost = "0.14.1"
prost-build = "0.14.1"
protox = "0.9.0"
toml = "1"

# Edge runtime. Pingora is 0.x and every minor release breaks the API, so it is
# pinned exactly; all Pingora-specific code lives in the `mg-edge` crate.
pingora = { version = "=0.9.0", default-features = false, features = ["proxy", "boringssl"] }
pingora-prometheus = "=0.9.0"
bytes = "1.10"
async-trait = "0.1.89"
clap = { version = "4.5", features = ["derive"] }
log = "0.4.28"
env_logger = { version = "0.11.8", default-features = false, features = ["auto-color", "humantime"] }
thiserror = "2.0.17"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
