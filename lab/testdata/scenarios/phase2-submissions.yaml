# Phase 2 acceptance (docs/impl/phase2-spec.md §17 WP-L2, §20): recorded,
# tampered and mismatched interactive submissions fail, and a foreign
# CF-Worker is still refused outright.
#
# D-59: the Lab has no solving logic. Replay, splicing, cross-client and
# concurrent double submissions of a C the Edge accepts are covered by
# edge/tests with mg-challenge's test helpers; here every request is a
# fixed recording:
#
#   - Two C were recorded on 2026-10-11 from an earlier lab-e2e Edge (route
#     "account": self_hold and pow_a11y; route "login" with Turnstile
#     first), sealed under a throwaway seal root that no Edge holds and long
#     expired. The submissions carry them with the session key, signature,
#     telemetry and PoW counters of testdata/phase2/samples/submissions
#     (signed over the sample's own placeholder C, so they would not verify
#     either).
#   - Each submission is answered with the unified failure (§7.5 step 4: the
#     C does not open), without a clearance cookie, a redirect or a new C;
#     replaying the same body twice changes nothing. So does a tampered or
#     truncated C, a provider the C does not offer, an unknown provider id
#     and a v1 interactive submission (form), and a renewal of the recorded
#     or the tampered C (§7.4 step 4).
#   - A Turnstile submission never reaches siteverify (the C does not open);
#     scripts/lab-e2e.sh checks that the loopback mock saw no call.
#   - A Worker of a zone the owner does not control (D-23) gets 403 on the
#     page, the verify entry, a submission and a renewal.
#
# Run by scripts/lab-e2e.sh against lab/testdata/e2e/site-p2.yaml:
#
#   mglab replay -map-host p2.lab.test=127.0.0.1 -base http://p2.lab.test:<edge port> \
#     -var run=<id> lab/testdata/scenarios/phase2-submissions.yaml
#
# CF-Connecting-IP stands in for cloudflared on the Edge's loopback listener;
# every address is from a documentation range.
name: phase2-submissions
description: Recorded, tampered and mismatched interactive submissions and renewals fail without a clearance; a foreign CF-Worker is refused.
vars:
  run: manual   # path segment that ties the events to one run

requests:
  # 1. The protected page: an interactive challenge, no cookie.
  - name: account page (navigation)
    method: GET
    path: /p2/account/${run}/home
    headers: &page
      CF-Connecting-IP: 203.0.113.111
      CF-Visitor: '{"scheme":"https"}'
      CF-IPCountry: US
      User-Agent: Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36
      Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8
      Accept-Language: en-US,en;q=0.9
      Sec-Fetch-Mode: navigate
      Sec-Fetch-Site: none
      Sec-Fetch-Dest: document
    expect_status: 403
    expect_header_absent: [Location]
    expect_cookie_absent: [__Host-mg_clr, __Host-mg_st]
    expect_body_contains: data-mg-type="interactive"

