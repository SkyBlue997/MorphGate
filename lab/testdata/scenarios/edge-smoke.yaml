# Benign smoke flow against a local mg-edge dev instance, e.g.
#   mglab replay -base http://127.0.0.1:8080 lab/testdata/scenarios/edge-smoke.yaml
name: edge-smoke
description: Health check and two proxied page loads of the owner's own dev origin.
base_url: http://127.0.0.1:8080
requests:
  - name: edge health
    method: GET
    path: /__mg/healthz
    expect_status: 200
  - name: home page
    method: GET
    path: /
    headers:
      Accept: text/html
      Accept-Language: zh-CN,zh;q=0.9,en;q=0.8
  - name: static asset
    method: GET
    path: /robots.txt?lab=1
