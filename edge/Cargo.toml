[package]
name = "mg-edge"
description = "MorphGate Edge: Pingora-based reverse proxy that hosts the Decision Core"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "mg-edge"
path = "src/main.rs"

[dependencies]
mg-core.workspace = true
mg-proto.workspace = true
mg-challenge.workspace = true
mg-intel.workspace = true
mg-edge-core.workspace = true
pingora.workspace = true
pingora-prometheus.workspace = true
arc-swap.workspace = true
async-trait.workspace = true
base64.workspace = true
bytes.workspace = true
clap.workspace = true
env_logger.workspace = true
getrandom.workspace = true
hickory-resolver.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
zeroize.workspace = true

[dev-dependencies]
mg-edge-core = { workspace = true, features = ["testkit"] }
# Session-key signing and the PoW v2 solver for the interactive flow tests
# (Phase 2 spec §17 WP-E2a, D-59).
mg-challenge = { workspace = true, features = ["testkit"] }
prost.workspace = true
# Valkey test clients (edge/tests/valkey_acl.rs, ratelimit_valkey.rs, verdicts.rs).
redis.workspace = true
# A second, independent TLS client stack (rustls) for the JA4 spike and its
# session resumption (edge/tests/ja4_spike.rs, WP-J1); already a dependency of
# mg-edge-core, so nothing new is built.
reqwest.workspace = true

[lints]
workspace = true
