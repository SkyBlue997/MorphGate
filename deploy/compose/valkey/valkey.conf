# Valkey config for the MorphGate dev environment.
# The password is passed on the command line from VALKEY_PASSWORD (see
# docker-compose.yml), so it never lands in this committed file.

# Listen on the container network; the host publishes 127.0.0.1:6379 only.
bind * -::*
port 6379
protected-mode yes

dir /data

# Durability: AOF with fsync once per second (docs/adr/0007-lean-deployment.md).
# At most ~1 s of writes (rate-limit counters, consumed nonces, verdicts) is lost
# on a crash. RDB snapshots stay on for the nightly backup copy.
appendonly yes
appendfsync everysec
appenddirname "appendonlydir"
aof-use-rdb-preamble yes
save 3600 1 300 100 60 10000

# Rate-limit and nonce keys must not be evicted silently: fail writes instead.
maxmemory-policy noeviction

loglevel notice
