# journald namespace for mg-edge (mg-edge.service: LogNamespace=morphgate).
#
# Install:
#   install -m 0644 deploy/systemd/journald@morphgate.conf /etc/systemd/
#   systemctl restart mg-edge   # starts systemd-journald@morphgate on demand
# Read:
#   journalctl --namespace=morphgate -u mg-edge
#
# The Edge's application log never holds client IPs, cookies, challenges,
# clearances or keys (docs/impl/phase1-spec.md D-31), but error logs need no
# longer than 14 days (§17 step 4). A namespace caps that for mg-edge alone,
# instead of SystemMaxRetentionSec= in journald.conf, which would cut the
# retention of every other service on the host.
# edge/tests/shipped_configs.rs checks the namespace name and the cap.

[Journal]
Storage=persistent
MaxRetentionSec=14day
SystemMaxUse=1G
