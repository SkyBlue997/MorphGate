# Golden Phase 2 site (docs/impl/phase2-spec.md §10.2, §17 WP-G4): every
# Phase 2 key of the site YAML, a limiter with on_exceed type interactive and
# the Turnstile provider, on top of the rules, lists and artifacts of
# site-rules.yaml. Its signed build with version 1790000000 and time
# 2026-09-27T10:00:00Z is golden-phase2.bundle (schema_version 2); edge-core
# and mg-edge verify and decode it in Rust.
# Regenerate: go test ./internal/bundle -run TestGolden -update
version: 1
site: blog
profile: cloudflare
hosts: [example.com, www.example.com, staging.example.com]
allowed_listeners: [cf-tunnel]
monitor_only: true
share_ip_verdicts: true

cloudflare:
  zone: example.com
  location_headers: true
  tier1: true
  owner_zones: [example.com]
  origin_mode: tunnel

token:
  active_kid: blog-t-20260928
  verify_kids: [blog-t-20260927]

clearance:
  ttl_pow_s: 1200
  ttl_interactive_s: 2400
  ttl_interactive_a11y_s: 600
  ttl_interactive_ext_s: 1500
  refresh: true
  refresh_max_interactive_s: 10800
  refresh_max_ext_s: 5400
  refresh_max_pow_s: 1800

challenge:
  pow_bits: {low: 12, medium: 15, high: 18, very_high: 21}
  fallback_ret: /account/
  default_lang: en
  help_path: /help/verification
  privacy_path: /privacy?section=verification
  interactive:
    enabled: true
    pow_bits: {low: 13, medium: 15, high: 17, very_high: 19}
    pow_k: 6
    a11y_bits: 18
    escalate_after: 3
    scoring: {mode: enforce, t_pass: 0.4, t_block: 0.8}
    min_pow_ms: 250
    a11y_min_ms: 2500
    issue: {rate: 40/10m, burst: 25}
    renew: {rate: 20/5m, burst: 8}
    a11y_issue: {per_ip: 5, per_ipp: 100, period_s: 1800}

scoring:
  weights: {http.ua_library: 2.5}
crawlers:
  purposes: {ai_training: block}
events:
  telemetry_behavior: true
  scanner_baits: {builtin: false, extra: ["/wp-login.php", "/.env*", "/old-admin/**"]}
origin_headers: {reasons: true}

providers:
  - id: turnstile
    enabled: true
    sitekey: 0x4AAAAAAAkat-test-sitekey
    hostnames: [example.com, www.example.com]
    routes: [login, signup]
    selection: escalate_after_fail
    mode: shadow
    timeout_ms: 3500
    fallback: self_hold
    deny_countries: [CN]

lists:
  owner_cidrs: [203.0.113.0/24, "2001:db8::/32"]
list_files:
  bad_uas: lists/bad-uas.txt
artifacts:
  cloudflare_ips: ../../../../testdata/phase1/artifacts/cloudflare-ips.json
  crawler_registry: ../../../../testdata/phase1/artifacts/crawler-registry.test.json
  datacenter_asns: ../../../../testdata/phase1/artifacts/datacenter-asns.txt
  tor_exits: ../../../../testdata/phase1/artifacts/tor-exits.txt

environments:
  - name: production
    hosts: [example.com, www.example.com]
    policies: [policies/production.yaml]
    routes:
      - name: login
        paths: ["/account/login"]
        methods: [GET]
        sensitivity: critical
        min_level: interactive
      - name: signup
        paths: ["/account/signup"]
        methods: [GET, HEAD]
        sensitivity: high
        proof: off
        min_level: pow
      - name: api
        paths: ["/api/**"]
        channel: api
        sensitivity: medium
        proof: required
        min_level: invisible
    rate_limits:
      - id: login-per-ip
        routes: [login]
        key: [ip]
        rate: 20/1m
        burst: 5
        on_exceed: {action: rate_limit, retry_after_s: 60}
      - id: signup-per-ip
        routes: [signup]
        key: [ip]
        rate: 10/10m
        burst: 3
        on_exceed: {action: challenge, type: interactive}
  - name: staging
    hosts: [staging.example.com]
    policies: [policies/staging.yaml]
