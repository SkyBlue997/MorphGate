profile: cloudflare
policies:
  - id: owner-networks-allow
    phase: identity
    priority: 10
    expr: has(net.ip) && ip_in(net.ip, list("owner_cidrs"))
    action: allow

  - id: block-impersonators
    phase: identity
    expr: risk.class == "IMPERSONATOR"
    action: block

  - id: scanner-block
    phase: protocol
    expr: '"scanner" in labels'
    action: block

  - id: bad-user-agents
    phase: protocol
    expr: '"user-agent" in req.headers && req.headers["user-agent"] in list("bad_uas")'
    action: challenge
    params: { type: pow }

  - id: login-high-risk
    phase: bot
    expr: route.name == "login" && risk.score >= 60
    action: challenge
    params: { type: pow }
    mode: dry_run

  - id: admin-glob-log
    phase: custom
    expr: glob(req.path, "/admin/**")
    action: log

  - id: legacy-browser-tag
    phase: custom
    priority: 5
    expr: '"user-agent" in req.headers && req.headers["user-agent"].contains("MSIE ")'
    action: tag
    params: { label: legacy_browser }

  - id: login-rate
    phase: rate_limit
    expr: '"login-per-ip" in rate && rate["login-per-ip"] > 0.8'
    action: rate_limit
    params: { limiter: login-per-ip, retry_after_s: "30" }

  - id: retired-rule
    phase: bot
    expr: risk.score > 99
    action: block
    mode: disabled
