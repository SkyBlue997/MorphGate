# Golden site without policy rules (spec §14.2 TestGolden). The signed build
# of this file with version 1790000000 and time 2026-09-27T10:00:00Z is
# golden-norules.bundle; mg-edge's tests verify and decode it in Rust.
# Regenerate: go test ./internal/bundle -run TestGolden -update
version: 1
site: blog
profile: cloudflare
hosts: [example.com, www.example.com, staging.example.com]
allowed_listeners: [cf-tunnel]
monitor_only: true
case_insensitive_paths: true

cloudflare:
  zone: example.com
  location_headers: true
  owner_zones: [example.com]
  origin_mode: tunnel

token:
  active_kid: blog-t-20260927

lists:
  owner_cidrs: [203.0.113.0/24, "2001:db8::/32"]

environments:
  - name: production
    hosts: [example.com, www.example.com]
    routes:
      - name: login
        paths: ["/account/login", "/api/login"]
        methods: [GET, POST]
        sensitivity: critical
      - name: reset
        paths: ["/Account/Reset/**"]
        sensitivity: high
        redact_path: true
      - name: api
        paths: ["/api/**"]
        channel: api
        sensitivity: medium
    rate_limits:
      - id: login-per-ip
        routes: [login]
        key: [ip]
        rate: 20/1m
        burst: 5
        on_exceed: {action: rate_limit, retry_after_s: 60}
      - id: api-per-prefix
        routes: [api]
        key: [ip_prefix, route]
        rate: 600/1m
        burst: 100
        scope: local
        on_exceed: {action: signal, weight: 1.5}
        mode: dry_run
  - name: staging
    hosts: [staging.example.com]
