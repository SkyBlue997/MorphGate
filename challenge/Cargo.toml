[package]
name = "mg-challenge"
description = "MorphGate challenge cryptography: sealed challenges, epoch keys, SHA-256 PoW, PASETO v4.local clearance tokens (Phase 1)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
