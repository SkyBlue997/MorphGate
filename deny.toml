# cargo-deny policy for the Rust workspace (`make deny`, CI job "Dependency
# audit"). Advisories come from the RustSec database, fetched at run time.

[graph]
all-features = true

[advisories]
# Vulnerabilities and unsound crates fail; so does a yanked version in
# Cargo.lock. An ignore entry names the advisory and why it does not apply.
yanked = "deny"
ignore = []

[licenses]
# Permissive licenses only (the workspace is Apache-2.0).
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.9

[bans]
# Duplicate versions are common in a Pingora tree and not a security
# problem; report them without failing.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
# crates.io only: no other registry, no git dependencies.
unknown-registry = "deny"
unknown-git = "deny"
