syntax = "proto3";

package morphgate.v1;

import "morphgate/v1/common.proto";

option go_package = "morphgate/control-plane/gen/morphgate/v1;morphgatev1";

// Signed configuration bundle that the Edge pulls (docs/02-data-flow.md §6).
// Key material is never included; only key ids. One SiteBundle per site.
//
// Phase 1 schema (docs/impl/phase1-spec.md §8): built from the owner's site
// YAML by `mgctl bundle build`, signed by `mgctl bundle sign`, loaded by
// mg-edge. Host-local settings (listener addresses, TLS files, the origin
// address, credential paths) live in the Edge's edge.toml, never here.
// Zero values mean "use the documented default" (spec §8.3) unless a comment
// says otherwise.

message UpstreamProfile {
  UpstreamProfileKind kind = 1;
  // Phase 1 uses only `kind` and `expected_mask`: listener authentication is
  // host-local (edge.toml [[listeners]]). Fields 2-7 are reserved for later
  // profiles (Phase 4/5) and must be left empty by the Phase 1 builder.
  bool tunnel_loopback_only = 2;           // cloudflare via Tunnel: trust 127.0.0.1 / ::1 peer only
  string origin_pull_ca_ref = 3;           // AOP / origin mTLS client-certificate CA (key ref)
  string secret_header_name = 4;           // optional rotating shared-secret header
  repeated string secret_header_refs = 5;  // up to two active secrets (refs, not values)
  repeated string trusted_proxy_cidrs = 6; // e.g. Cloudflare ranges from the IP sync job
  uint32 proxy_protocol_version = 7;       // 1 or 2 for PROXY_PROTOCOL
  // Signal families this upstream is expected to supply (bit per SignalFamily).
  uint32 expected_mask = 8;
}

message Route {
  string id = 1;
  string name = 2;               // [a-z0-9_-]{1,32}; also the sealed route_class
  repeated string hosts = 3;     // empty = every host of the environment
  string path_glob = 4;          // deprecated in Phase 1: the builder writes `paths`; the Edge treats a
                                 // non-empty path_glob as one more entry of `paths`
  repeated string methods = 5;   // upper-case; empty = any method
  Channel channel = 6;
  RouteSensitivity sensitivity = 7;
  bool fail_closed = 8;          // behaviour when dependencies are unavailable (spec §9.9)
  repeated string paths = 9;     // glob patterns (policy glob syntax) matched against every path view (spec §9.4)
  bool require_clearance = 10;   // CHALLENGE unless a valid clearance token is presented
  bool redact_path = 11;         // events and access records log "/<route name>" instead of the path (tokenized URLs)
  RouteMode mode = 12;           // monitor / enforce override of SiteBundle.monitor_only (spec I-36)
  bool never_challenge = 13;     // CHALLENGE is recorded and forwarded; BLOCK / RATE_LIMIT apply (spec I-37)
  // Phase 2 (docs/impl/phase2-spec.md §3.2); both must be zero when schema_version = 1.
  ProofMode proof = 14;          // D-40; an unknown value makes the bundle invalid
  ChallengeType min_level = 15;  // D-64; UNSPECIFIED | INVISIBLE | POW | INTERACTIVE, anything else is invalid
}

// MG-Proof requirement of a route (Phase 2 spec D-40, §9.1). When a request
// matches several routes, proof is required if any of them requires it.
enum ProofMode {
  PROOF_MODE_OFF = 0;
  PROOF_MODE_REQUIRED = 1;
}

// Per-route override of the site's monitor switch (spec I-36). When a request
// matches several routes through different path views (spec §9.4), the
// strictest wins: ENFORCE > INHERIT > MONITOR. An unknown value makes the
// bundle invalid.
enum RouteMode {
  ROUTE_MODE_INHERIT = 0;        // follow SiteBundle.monitor_only
  ROUTE_MODE_MONITOR = 1;        // record decisions, enforce nothing
  ROUTE_MODE_ENFORCE = 2;        // enforce even when SiteBundle.monitor_only is set
}

message CompiledRule {
  string id = 1;
  string phase = 2;              // identity | protocol | rate_limit | bot | custom | default
  int32 priority = 3;            // higher runs first within a phase; ties by id (bytewise ascending)
  string expr_source = 4;        // CEL source, kept for audit and display
  uint32 ir_version = 5;         // 1 in Phase 1
  bytes expr_ir = 6;             // serialized morphgate.v1.PolicyExpr (policy_ir.proto)
  Action action = 7;
  // Phase 1 keys: type (challenge: invisible | pow | interactive), label (tag: [a-z0-9_.-]{1,32}),
  // limiter + retry_after_s (rate_limit). Unknown keys are rejected by the builder.
  map<string, string> params = 8;
  string mode = 9;               // enforce | dry_run | disabled
  uint32 rollout_percent = 10;   // 0..100
  int64 expires_at_ms = 11;      // 0 = never
  bool locked = 12;
}

message RateLimit {
  string id = 1;                 // [a-z0-9][a-z0-9_.-]{0,63}; "mg." prefix reserved for built-ins
  string route_id = 2;           // deprecated in Phase 1: folded into route_ids
  repeated string key = 3;       // Phase 1: ip | ip_prefix | asn | session | route (combination = tuple)
  string algorithm = 4;          // gcra (only value in Phase 1)
  uint32 rate = 5;               // requests per period
  uint32 period_s = 6;
  uint32 burst = 7;              // >= 1: requests allowed at one instant from a fresh state
  string on_exceed = 8;          // signal | challenge | rate_limit | block
  string mode = 9;               // enforce | dry_run
  repeated string route_ids = 10; // routes this limiter applies to; empty = every route of the environment
  string scope = 11;             // global (Valkey GCRA, local fallback) | local (in-process only)
  uint32 retry_after_s = 12;     // on_exceed = rate_limit: Retry-After; 0 = computed from GCRA
  ChallengeType challenge_type = 13; // on_exceed = challenge
  float signal_weight = 14;      // on_exceed = signal: log-odds contribution, 0 < w <= 2 (RATE family)
}

// External interactive provider (Phase 2 spec §3.2, §8.2, D-51). Public
// configuration only: the Turnstile secret is a deployment property in
// edge.toml [[sites]] turnstile_keys.
message ProviderConfig {                 // Phase 2: id "turnstile" only; self_hold and pow_a11y are built in
  string id = 1;
  bool enabled = 2;
  string sitekey = 3;                    // public widget sitekey
  repeated string secret_refs = 4;       // must be empty (D-51): the secret is in edge.toml
  repeated string allowed_countries = 5; // must be empty
  repeated string denied_countries = 6;  // ISO 3166-1 alpha-2 countries that never get Turnstile; empty by default, nothing is hard-coded (D-70)
  repeated string route_ids = 7;         // empty = every route
  uint32 timeout_ms = 8;                 // 1000..5000
  string fallback = 9;                   // Phase 2: "self_hold" only (D-51); anything else makes the bundle invalid
  string mode = 10;                      // "shadow" | "enforce"
  repeated string hostnames = 11;        // exact FQDNs in the widget; the request Host must be one of them
  string selection = 12;                 // "first" | "escalate_after_fail"
}

message Environment {
  string name = 1;               // production | staging | test | dev
  repeated Route routes = 2;     // first match wins; the builder appends a catch-all "default" route
  repeated CompiledRule rules = 3; // sorted: phase order, then priority desc, then id asc
  repeated RateLimit rate_limits = 4;
  bool automation_allowlist_only = 5; // true for staging/test/dev
  repeated string hosts = 6;     // hosts of this environment (a partition of SiteBundle.hosts)
}

message ArtifactRef {
  // Phase 1 names: geoip-asn | geoip-country | cloudflare-ips | crawler-registry |
  // datacenter-asns | tor-exits (formats: spec §12).
  string name = 1;
  string uri = 2;                // "artifacts/<sha256>" relative to the bundle root
  string sha256 = 3;             // lower-case hex of the file content
  string version = 4;            // producer version / fetched_at, informational
  uint64 size = 5;               // bytes
}

message SiteBundle {
  string site_id = 1;
  uint64 version = 2;            // strictly increasing per site
  int64 created_at_ms = 3;
  UpstreamProfile upstream = 4;
  repeated Environment environments = 5;
  repeated ProviderConfig providers = 6; // Phase 2: at most one entry, id "turnstile" (spec §8.2); empty when schema_version = 1
  repeated ArtifactRef artifacts = 7;
  repeated string token_key_ids = 8; // clearance key ids: [0] signs, all verify (material: edge credentials)
  bool monitor_only = 9;         // site monitor switch: record decisions, enforce nothing (Route.mode overrides it)
  // Optional activation delay for sensitive changes (docs/02 §6): the Edge
  // swaps to this bundle atomically at or after this time. 0 = immediately.
  int64 not_before_ms = 10;

  // 1, or 2 when any Phase 2 field or value is set (a limiter with challenge_type INTERACTIVE
  // included); the Phase 2 Edge accepts both (Phase 2 spec D-66, §3.2); anything else is invalid
  uint32 schema_version = 11;
  repeated string hosts = 12;    // every hostname of the site: lower-case, no port, no trailing dot
  repeated string allowed_listeners = 13; // edge.toml listener names that may serve this site
  ChallengeConfig challenge = 14;
  ClearanceConfig clearance = 15;
  ScoringConfig scoring = 16;
  CrawlerPolicy crawler_policy = 17;
  EventConfig events = 18;
  map<string, NamedList> lists = 19; // named lists for list("name") and ip_in(); name [a-z0-9][a-z0-9_.-]{0,63}
  CloudflareSiteConfig cloudflare = 20; // set iff upstream.kind == CLOUDFLARE
  OriginHeaderConfig origin_headers = 21;
  bool share_ip_verdicts = 22;   // also read/write IP / prefix / ASN verdicts under site "all" (docs/01 §10)
  string source_digest = 23;     // sha256 over the site YAML and policy files it was built from (audit)
  bool case_insensitive_paths = 24; // route patterns and path views compared lower-cased (spec §9.4)
}

message ChallengeConfig {
  message PowBits {
    uint32 low = 1;
    uint32 medium = 2;
    uint32 high = 3;
    uint32 very_high = 4;
  }
  uint32 ttl_s = 1;              // lifetime of invisible / pow C, <= 120
  PowBits pow_bits = 2;          // SHA-256 hashcash difficulty (leading zero bits) per risk band
  string fallback_ret = 3;       // return path for challenged non-GET navigations, e.g. "/"
  uint32 max_failures = 4;       // failed submissions per ip entity per failure_window_s before 429 (x4 per ipp)
  uint32 failure_window_s = 5;
  uint32 submit_rate = 6;        // built-in limiter mg.c.submit (per ipp)
  uint32 submit_period_s = 7;
  uint32 submit_burst = 8;
  uint32 issue_per_ipp = 9;      // clearance issuance quota (enforced: 429) per ipp ...
  uint32 issue_per_asn = 10;     // ... and per ASN, per issue_period_s
  uint32 issue_period_s = 11;
  // Phase 2 (spec §3.2, §10.2): zero / empty when schema_version = 1, required and in range when 2.
  InteractiveConfig interactive = 12;
  string default_lang = 13;      // "zh-CN" | "en": page language when Accept-Language has neither (section 12.7)
  string help_path = 14;         // site-relative path of the "troubleshooting" link, validated like ret (section 12.3)
  string privacy_path = 15;      // site-relative path of the privacy notice link, validated like ret
}

// Interactive challenge settings (Phase 2 spec §3.2, §10.2).
message InteractiveConfig {
  bool enabled = 1;              // false: Phase 1 behaviour, interactive runs as pow (D-08)
  ChallengeConfig.PowBits pow_bits = 2;  // self_hold, per sub-puzzle, by risk band; each 8..22
  uint32 pow_k = 3;              // sub-puzzles for every interactive C, 1..8
  uint32 a11y_bits = 4;          // pow_a11y, per sub-puzzle; 12..24
  uint32 escalate_after = 5;     // N of D-50, 1..5
  string scoring_mode = 6;       // "shadow" | "enforce" (enforce requires t_pass and t_block)
  float t_pass = 7;              // enforce only: 0 < t_pass < t_block <= 1
  float t_block = 8;
  uint32 min_pow_ms = 9;         // PoW floor of the minimum-time check for hold / single (section 7.7), 0..5000
  uint32 issue_rate = 10;        // limiter mg.ix.issue: interactive C issued per ip entity (renewals included);
  uint32 issue_period_s = 11;    //   the ipp limit is 4x (D-67)
  uint32 issue_burst = 12;
  uint32 a11y_issue_per_ip = 13;   // limiter mg.a11y.issue: interactive_a11y clearances per ip entity
  uint32 a11y_issue_period_s = 14; //   (both dimensions share the period)
  uint32 a11y_min_ms = 15;       // minimum-time check for pow_only (section 7.7), 0..10000
  uint32 renew_rate = 16;        // limiter mg.c.renew per ip entity; ipp 4x
  uint32 renew_period_s = 17;
  uint32 renew_burst = 18;
  uint32 a11y_issue_per_ipp = 19;  // limiter mg.a11y.issue: per ipp, >= a11y_issue_per_ip (section 7.9)
}

message ClearanceConfig {
  uint32 ttl_invisible_s = 1;    // lvl invisible
  uint32 ttl_pow_s = 2;          // lvl pow
  uint32 session_max_s = 3;      // reuse the previous token's sub while now - sst <= session_max_s (spec §6.5)
  bool ctp_shadow = 4;           // compute and record bind.ctp (cloudflare only, never enforced)
  // Phase 2 (spec §3.2, §6.8, D-47): zero when schema_version = 1, required and in range when 2.
  uint32 ttl_interactive_s = 5;          // 300..7200
  uint32 ttl_interactive_a11y_s = 6;     // 300..3600
  uint32 ttl_interactive_ext_s = 7;      // 300..7200
  bool refresh = 8;                      // accept POST /__mg/r (D-47); default false
  uint32 refresh_max_interactive_s = 9;  // 900..86400: now - lat cap for interactive
  uint32 refresh_max_ext_s = 10;         // 900..86400: now - lat cap for interactive_ext:*
  uint32 refresh_max_pow_s = 11;         // 0..86400: now - lat cap for pow (0 = pow tokens never refresh)
}                                        // interactive_a11y and invisible never refresh

message ScoringConfig {
  float theta_c = 1;             // confidence threshold of the default matrix
  float kappa = 2;               // 0 = profile default (direct_tls 1.0, cloudflare 0.9)
  map<string, float> z0 = 3;     // route sensitivity (low | medium | high | critical) -> prior log-odds
  map<string, string> family_modes = 4; // SignalFamily wire name -> active | shadow | off
  map<string, float> weights = 5; // detector signal id -> w_s override
  float h_min = 6;               // floor of the summed human (negative) evidence
  string ruleset_version = 7;    // logged as RiskAssessment.ruleset_version
}

message CrawlerPolicy {
  map<string, string> purposes = 1; // purpose -> allow | block (verified crawlers only)
  string default_action = 2;     // for purposes not listed: allow | block
}

message EventConfig {
  float allow_sample_rate = 1;   // sampling of ALLOW / TAG / LOG decisions on low / medium routes (0..1)
  bool access_log = 2;           // one kind=access record per request (docs/02 §9)
  bool stream = 3;               // XADD a compact summary to mg:ev
  // Phase 2 (spec §3.2): zero / empty when schema_version = 1 (the Edge then uses builtin = true).
  bool telemetry_behavior = 4;           // accept behavior reports on /__mg/t (D-48)
  bool scanner_baits_builtin = 5;        // flag the built-in scanner paths in mg:ev v2 (section 13.1)
  repeated string scanner_baits = 6;     // extra globs, same syntax as route paths, at most 64
}

message NamedList {
  repeated string entries = 1;   // <= 10000 entries
}

message CloudflareSiteConfig {
  string zone = 1;               // the owner's zone name, e.g. example.com
  bool location_headers = 2;     // trust cf-ipcountry / cf-region / cf-region-code / cf-timezone
  bool tier1 = 3;                // parse Tier 1 x-mg-cf-* (still requires the x-mg-cf-t1 marker)
  repeated string owner_zones = 4; // zones whose Workers may send subrequests (CF-Worker)
  bool pseudo_ipv4_overwrite = 5; // read the client IP from CF-Connecting-IPv6
}

message OriginHeaderConfig {
  bool scores = 1;               // MG-Bot-Score, MG-Bot-Class, MG-Verified
  bool reasons = 2;              // MG-Reasons (default off)
  bool session = 3;              // MG-Session
}

// Detached signature over the serialized SiteBundle bytes.
//   ed25519_signature = Ed25519-Sign(owner key `key_id`, "mg-bundle-v1" || 0x00 || bundle)
message SignedBundle {
  bytes bundle = 1;              // serialized SiteBundle
  string key_id = 2;             // owner signing key id (kid)
  bytes ed25519_signature = 3;
}
